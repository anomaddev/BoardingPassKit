name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: build-env
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # Do not set registry-url. It writes `_authToken=${NODE_AUTH_TOKEN}` into
          # .npmrc, which forces the token auth path and turns an expired or
          # placeholder NPM_TOKEN into a misleading 404 on `npm publish`.

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          PKG_VERSION=$(node -p "require('./packages/node/package.json').version")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($VERSION) does not match packages/node/package.json ($PKG_VERSION)"
            exit 1
          fi
          echo "Publishing boarding-pass-kit@$PKG_VERSION"

      - name: Log publish version
        if: github.event_name == 'workflow_dispatch'
        run: |
          PKG_VERSION=$(node -p "require('./packages/node/package.json').version")
          echo "Manual publish of boarding-pass-kit@$PKG_VERSION"

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: |
          npm install -g npm@latest
          npm publish -w boarding-pass-kit --provenance --access public

  publish-github:
    name: Publish to GitHub Packages
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Publish @anomaddev/boarding-pass-kit to GitHub Packages
        working-directory: packages/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "@anomaddev:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
          node -e "const f='package.json',p=require('./'+f);p.name='@anomaddev/boarding-pass-kit';p.repository={type:'git',url:'https://github.com/anomaddev/BoardingPassKit.git'};p.publishConfig={registry:'https://npm.pkg.github.com'};require('fs').writeFileSync(f,JSON.stringify(p,null,2))"
          npm publish
