[workspace]
resolver = "2"
members = [
    "packages/rust",
    "packages/ffi",
    "packages/python",
]
default-members = [
    "packages/rust",
    "packages/ffi",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/anomaddev/BoardingPassKit"
authors = ["BoardingPassKit Contributors"]

[workspace.dependencies]
boarding-pass-kit = { path = "packages/rust", version = "0.2.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
