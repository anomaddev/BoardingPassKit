[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "boarding-pass-kit"
version = "0.2.0"
description = "IATA BCBP boarding pass barcode decoder (Rust core via PyO3)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "boarding_pass_kit"
features = ["pyo3/extension-module"]
